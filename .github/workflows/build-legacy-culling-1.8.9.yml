name: Build Legacy Culling 1.8.9

on:
  push:
    branches: [legacy-culling-1.8.9]
  pull_request:
    branches: [sodium-culling-addon-26.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build baseline
        shell: bash
        run: |
          set -o pipefail
          gradle -p legacy-culling-1.8.9 clean build --stacktrace 2>&1 | tee legacy-build.log
      - name: Inspect resolved 1.8.9 named API
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          find "$HOME/.gradle" -type f -name '*.jar' | grep -E '1\.8\.9|minecraft' > all-minecraft-jars.txt || true
          named=$(while read -r f; do
            if jar tf "$f" 2>/dev/null | grep -q 'net/minecraft/client/render/WorldRenderer.class'; then
              echo "$f"
              break
            fi
          done < all-minecraft-jars.txt)
          if [ -z "${named:-}" ]; then
            echo 'Could not locate named Minecraft jar' > legacy-api-report.txt
            exit 0
          fi
          cp "$named" named-minecraft-1.8.9.jar
          echo "Named jar: $named" > legacy-api-report.txt
          jar tf "$named" | grep -E 'net/minecraft/client/(render|particle|gui|world)/.*(WorldRenderer|GameRenderer|EntityRenderDispatcher|BlockEntityRenderDispatcher|ParticleManager|VideoOptions|Debug|BuiltChunk|ChunkBuilder|Occlusion|Sign|Button|Screen).*class' | sort >> legacy-api-report.txt || true
          for cls in \
            net.minecraft.client.MinecraftClient \
            net.minecraft.client.render.WorldRenderer \
            net.minecraft.client.render.WorldRenderer\$ChunkInfo \
            net.minecraft.client.render.GameRenderer \
            net.minecraft.client.render.entity.EntityRenderDispatcher \
            net.minecraft.client.render.entity.EntityRenderer \
            net.minecraft.client.render.block.entity.BlockEntityRenderDispatcher \
            net.minecraft.client.render.block.entity.BlockEntityRenderer \
            net.minecraft.client.render.block.entity.SignBlockEntityRenderer \
            net.minecraft.client.particle.ParticleManager \
            net.minecraft.client.particle.Particle \
            net.minecraft.client.render.CameraView \
            net.minecraft.client.render.BaseFrustum \
            net.minecraft.client.render.Frustum \
            net.minecraft.client.world.BuiltChunk \
            net.minecraft.client.render.BuiltChunkStorage \
            net.minecraft.client.render.chunk.ChunkBuilder \
            net.minecraft.client.render.chunk.ChunkOcclusionData \
            net.minecraft.client.render.chunk.ChunkOcclusionDataBuilder \
            net.minecraft.client.gui.hud.DebugHud \
            net.minecraft.client.gui.screen.VideoOptionsScreen \
            net.minecraft.client.gui.screen.Screen \
            net.minecraft.client.gui.widget.ButtonWidget \
            net.minecraft.entity.Entity \
            net.minecraft.entity.decoration.AbstractDecorationEntity \
            net.minecraft.entity.decoration.PaintingEntity \
            net.minecraft.entity.decoration.ItemFrameEntity \
            net.minecraft.entity.decoration.ArmorStandEntity \
            net.minecraft.entity.boss.dragon.EnderDragonEntity \
            net.minecraft.entity.boss.WitherEntity \
            net.minecraft.entity.player.PlayerEntity \
            net.minecraft.entity.mob.HostileEntity \
            net.minecraft.entity.passive.PassiveEntity \
            net.minecraft.entity.projectile.ArrowEntity \
            net.minecraft.entity.FallingBlockEntity \
            net.minecraft.entity.ItemEntity \
            net.minecraft.block.entity.BlockEntity \
            net.minecraft.block.entity.SignBlockEntity \
            net.minecraft.block.entity.BeaconBlockEntity \
            net.minecraft.block.entity.EnchantingTableBlockEntity \
            net.minecraft.block.entity.EndPortalBlockEntity \
            net.minecraft.block.entity.SkullBlockEntity \
            net.minecraft.block.LeavesBlock \
            net.minecraft.client.font.TextRenderer \
            net.minecraft.client.render.entity.ItemEntityRenderer \
            net.minecraft.client.render.entity.feature.StuckArrowsFeatureRenderer \
            net.minecraft.client.resource.ResourcePackLoader \
            net.minecraft.util.math.Box \
            net.minecraft.util.math.Vec3d \
            net.minecraft.util.math.BlockPos \
            net.minecraft.world.World
          do
            echo >> legacy-api-report.txt
            echo "===== $cls =====" >> legacy-api-report.txt
            javap -classpath "$named" -private "$cls" >> legacy-api-report.txt 2>&1 || true
          done
          cat legacy-api-report.txt
      - name: Validate packaged runtime jar
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          runtime=$(find legacy-culling-1.8.9/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*developer*' | head -n 1)
          test -n "$runtime"
          jar tf "$runtime" | grep -qx 'fabric.mod.json'
          jar tf "$runtime" | grep -qx 'com/memphiscat/legacyculling/LegacyCullingMod.class'
          echo "Validated $runtime"
      - name: Upload baseline jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-culling-1.8.9
          path: legacy-culling-1.8.9/build/libs/*.jar
          retention-days: 7
      - name: Upload named Minecraft API jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: named-minecraft-1.8.9-api
          path: named-minecraft-1.8.9.jar
          retention-days: 1
      - name: Upload logs and API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-culling-1.8.9-build-info
          path: |
            legacy-build.log
            legacy-api-report.txt
            all-minecraft-jars.txt
          if-no-files-found: warn
          retention-days: 7
