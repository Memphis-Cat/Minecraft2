name: Build Legacy Culling 1.8.9

on:
  push:
    branches: [legacy-culling-1.8.9]
  pull_request:
    branches: [sodium-culling-addon-26.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build mod
        shell: bash
        run: |
          set -o pipefail
          gradle -p legacy-culling-1.8.9 clean build --stacktrace 2>&1 | tee legacy-build.log

      - name: Validate packaged runtime jar
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import zipfile

          libs = pathlib.Path('legacy-culling-1.8.9/build/libs')
          runtime = next(p for p in libs.glob('*.jar') if 'source' not in p.name.lower() and 'developer' not in p.name.lower())
          with zipfile.ZipFile(runtime) as z:
              names = set(z.namelist())
              assert 'fabric.mod.json' in names
              assert 'legacyculling.mixins.json' in names
              mixins = json.loads(z.read('legacyculling.mixins.json'))
              package = mixins['package'].replace('.', '/')
              missing = [m for m in mixins['client'] if f'{package}/{m}.class' not in names]
              assert not missing, f'Missing mixin classes: {missing}'
          print('Validated runtime:', runtime)
          PY

      - name: Client startup smoke test
        shell: bash
        run: |
          set +e
          timeout 90s xvfb-run -a \
            -s '-screen 0 1280x720x24 -ac +extension GLX +extension RANDR +render -noreset' \
            gradle -p legacy-culling-1.8.9 runClient --stacktrace --no-daemon \
            > legacy-client-smoke.log 2>&1
          exit_code=$?
          set -e
          cat legacy-client-smoke.log
          latest='legacy-culling-1.8.9/run/logs/latest.log'
          test -f "$latest"
          grep -q 'Legacy Culling initialized for Minecraft 1.8.9' "$latest"
          if grep -E 'Mixin apply failed|InjectionError|InvalidMixinException|MixinApplyError|Mod resolution encountered|Could not execute entrypoint' "$latest"; then
            exit 1
          fi
          cp "$latest" legacy-smoke-latest.log
          if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 124 ]; then
            exit "$exit_code"
          fi

      - name: Package source project
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          zip -qr Legacy-Culling-1.8.9-Source-Project.zip legacy-culling-1.8.9 \
            -x 'legacy-culling-1.8.9/build/*' \
               'legacy-culling-1.8.9/run/*' \
               'legacy-culling-1.8.9/.gradle/*' \
               'legacy-culling-1.8.9/.build-tools/*'

      - name: Upload mod jars and source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-culling-1.8.9
          path: |
            legacy-culling-1.8.9/build/libs/*.jar
            Legacy-Culling-1.8.9-Source-Project.zip
          retention-days: 7

      - name: Upload build and smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-culling-1.8.9-build-info
          path: |
            legacy-build.log
            legacy-client-smoke.log
            legacy-smoke-latest.log
          if-no-files-found: warn
          retention-days: 7
