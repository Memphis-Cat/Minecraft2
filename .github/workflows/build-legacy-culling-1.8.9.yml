name: Build Legacy Culling Native Stage One

on:
  push:
    branches: [legacy-culling-native-stage1b]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build and remap
        run: gradle -p legacy-culling-1.8.9 clean build --stacktrace
