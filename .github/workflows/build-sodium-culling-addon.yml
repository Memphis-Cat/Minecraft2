name: Build Sodium Culling Addon

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build mod
        shell: bash
        run: |
          set -o pipefail
          gradle -p sodium-culling-addon clean build --stacktrace 2>&1 | tee build.log
      - name: Download Sodium for smoke test
        shell: bash
        run: |
          mkdir -p sodium-culling-addon/run/mods
          python - <<'PY'
          import json
          import pathlib
          import urllib.parse
          import urllib.request

          query = urllib.parse.urlencode({
              "game_versions": '["26.2"]',
              "loaders": '["fabric"]'
          })
          request = urllib.request.Request(
              "https://api.modrinth.com/v2/project/sodium/version?" + query,
              headers={"User-Agent": "Memphis-Cat-Sodium-Culling-CI/1.0"}
          )
          versions = json.load(urllib.request.urlopen(request))
          version = next(v for v in versions if "0.9.1" in v["version_number"])
          file = next((f for f in version["files"] if f.get("primary")), version["files"][0])
          target = pathlib.Path("sodium-culling-addon/run/mods") / file["filename"]
          urllib.request.urlretrieve(file["url"], target)
          print(target)
          PY
      - name: Client startup smoke test
        shell: bash
        run: |
          set +e
          timeout 90s xvfb-run -a gradle -p sodium-culling-addon runClient --stacktrace --no-daemon > client-smoke.log 2>&1
          exit_code=$?
          set -e
          cat client-smoke.log
          latest="sodium-culling-addon/run/logs/latest.log"
          test -f "$latest"
          grep -q "Sodium Culling Addon initialized" "$latest"
          if grep -E "Mixin apply failed|InjectionError|InvalidMixinException|Mod resolution encountered|Failed to start the minecraft server" "$latest"; then
            exit 1
          fi
          if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 124 ]; then
            exit "$exit_code"
          fi
      - name: Upload build and smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sodium-culling-build-log
          path: |
            build.log
            client-smoke.log
            sodium-culling-addon/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sodium-culling-addon-26.2
          path: sodium-culling-addon/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
