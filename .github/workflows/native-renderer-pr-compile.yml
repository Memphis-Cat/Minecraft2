name: Compile Native Legacy Renderer

on:
  pull_request:
    branches: [legacy-native-ci-base2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Compile and remap
        shell: bash
        run: |
          set -o pipefail
          gradle -p legacy-culling-1.8.9 clean build --stacktrace 2>&1 | tee legacy-native-build.log

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-native-compiler-log
          path: legacy-native-build.log
          if-no-files-found: warn
          retention-days: 7
